<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HotsNew Quick Link</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 360px;
        background:
          radial-gradient(
            circle at top right,
            rgba(249, 115, 22, 0.28),
            transparent 36%
          ),
          #0f172a;
        color: #e2e8f0;
      }

      main {
        padding: 18px;
      }

      .shell {
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 22px;
        background: rgba(15, 23, 42, 0.82);
        box-shadow: 0 18px 40px rgba(2, 6, 23, 0.35);
        overflow: hidden;
      }

      .header {
        padding: 18px 18px 14px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #fb923c;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: #94a3b8;
        font-size: 13px;
        line-height: 1.5;
      }

      .content {
        padding: 18px;
      }

      .url {
        margin: 0 0 12px;
        padding: 14px;
        border-radius: 16px;
        background: rgba(51, 65, 85, 0.4);
        border: 1px solid rgba(148, 163, 184, 0.12);
        font-size: 12px;
        word-break: break-word;
      }

      .status {
        margin: 0 0 12px;
        min-height: 18px;
        font-size: 12px;
        color: #94a3b8;
      }

      .status[data-tone="success"] {
        color: #4ade80;
      }

      .grid {
        display: grid;
        gap: 10px;
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 13px 14px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          opacity 0.15s ease,
          background 0.15s ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .primary {
        background: linear-gradient(135deg, #f97316, #fb923c);
        color: white;
      }

      .secondary {
        background: #1e293b;
        color: #e2e8f0;
        border: 1px solid rgba(148, 163, 184, 0.16);
      }

      .hint {
        margin-top: 14px;
        padding: 14px;
        border-radius: 16px;
        background: rgba(249, 115, 22, 0.08);
        color: #cbd5e1;
        font-size: 12px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="shell">
        <div class="header">
          <div class="eyebrow">HotsNew Quick Link</div>
          <h1>Lấy Link Nhanh</h1>
          <p>Giúp bạn lấy URL hiện tại và mở nhanh</p>
        </div>

        <div class="content">
          <div id="currentUrl" class="url">Đang lấy URL hiện tại...</div>
          <div id="status" class="status"></div>

          <div class="grid">
            <button id="openApp" class="primary" type="button">
              Mở màn hình tạo Link
            </button>
            <button id="copyUrl" class="secondary" type="button">
              Copy URL hiện tại
            </button>
            <button id="openRoot" class="secondary" type="button">
              Mở trang chủ HotsNew
            </button>
          </div>

          <div class="hint">
            Meo: Bạn có thể mở menu trình duyệt (thường là biểu tượng 3 chấm
            hoặc 3 gạch ở góc trên bên phải) và chọn "HotsNew Quick Link" để
            truy cập nhanh vào popup này bất cứ lúc nào nhé!
          </div>
        </div>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
